name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  # bun audit registry override — use ONLY npm_config_registry (not both casings)
  npm_config_registry: "https://registry.npmjs.org"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lab tests
        run: bun test ./tests

      - name: Dial smoke (keyless)
        run: bun run src/dial.ts --profile eco "hello from CI"

      - name: Skills layout + frontmatter
        run: bun run check:skills

      - name: Bun audit
        run: bun run audit

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills

      - name: Wallet keys must not appear in CI env
        run: |
          if [[ -n "${BLOCKRUN_WALLET_KEY:-}" || -n "${SOLANA_WALLET_KEY:-}" ]]; then
            echo "wallet keys must not be set in CI" >&2
            exit 1
          fi

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Upstream CI at 147d1b9f2c2b
        run: bash scripts/upstream-ci.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .

      - name: Bun audit
        run: bun run audit

      - name: Vendor upstream lockfile for osv-scanner
        run: |
          set -euo pipefail
          PIN=147d1b9f2c2b7d31e3f7506a81b71bc421b9f53b
          mkdir -p vendor
          if [[ ! -d vendor/ClawRouter/.git ]]; then
            git clone --depth=1 https://github.com/BlockRunAI/ClawRouter vendor/ClawRouter
          fi
          git -C vendor/ClawRouter fetch --depth=1 origin "${PIN}" 2>/dev/null || \
            git -C vendor/ClawRouter fetch origin "${PIN}"
          git -C vendor/ClawRouter checkout "${PIN}"

      - name: Install pinned osv-scanner
        run: |
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner on upstream package-lock.json
        run: ./osv-scanner scan --config osv-scanner.toml --lockfile vendor/ClawRouter/package-lock.json

      - name: Skills frontmatter
        run: bun run check:skills

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills
